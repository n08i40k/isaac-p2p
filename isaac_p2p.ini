[p2p]
; 0 leaves Steam's networking settings untouched.
enabled=1
; Direct connection over the internet (UDP hole punching through NAT).
allow_public=1
; Direct connection inside one LAN.
allow_private=1
; Route through TURN servers from the ICE config (usually not configured; Valve's relay covers this case).
allow_turn=0
; Extra ping (ms) added when comparing routes. A higher relay penalty prefers the direct route.
direct_penalty_ms=0
relay_penalty_ms=20
; 1 forbids Valve's relay: a session that can't connect directly fails instead of falling back.
force_no_relay=0
; Comma-separated STUN servers, e.g. stun:stun.l.google.com:19302. Empty keeps Steam's default.
stun_servers=
; Write Steam's route negotiation messages to isaac_p2p.log.
log=1
; Log every player's route (relay / direct + address) and ping to isaac_p2p.log.
monitor=1
monitor_interval_ms=2000
; How often to log the ping while the route stays the same; 0 logs only route changes.
ping_log_interval_s=30

[transport]
; Own UDP transport: the host listens on a port, players connect by IP, game traffic bypasses Steam networking.
; Open a console window with the game for the transport commands (host, connect, status, disconnect).
console=1
; UDP port for "host", and the default port for "connect". A client binds it too when it is free, so one
; router or VPN rule for this port covers both roles.
port=27777
; auto: host while you own the Steam lobby you are in (create a lobby, invite, done); 1: always; 0: never.
; F11 in the game starts or stops hosting by hand.
host=auto
; ip[:port] to connect to when the game starts.
connect=
; 1 connects to the host of the Steam lobby you enter, when the host offers a direct connection.
join=1
; Extra addresses the host offers in its lobby, e.g. a forwarded port: 203.0.113.5:27777. Public and LAN
; addresses are found automatically.
addresses=
; Empty (default): players are verified through Steam and must be in the host's lobby; no setup needed.
; Set on the host: players connect with this password instead (also needed to connect by IP without a lobby).
; Console commands "host", "connect" and "join" take a password too.
password=
; Drop this percentage of outgoing datagrams (testing only).
drop_percent=0

[overlay]
; Connection HUD in the top-right corner. F9 cycles compact / detailed / hidden, F10 copies the password.
hud=1
