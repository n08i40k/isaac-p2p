[package]
name = "isaac_p2p"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "winmm"
crate-type = ["cdylib"]

[profile.release]
opt-level = 2
lto = true
panic = "abort"
strip = true
codegen-units = 1

[profile.dev]
panic = "abort"

[dependencies]
blake2 = "0.10"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = "2"
